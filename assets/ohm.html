<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ॐ</title>
    <meta name='description' content='Signal before noise. The constant underneath the compression work.'>
    <!-- Framing: Signal before noise. The constant underneath the compression work. -->
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body {
  width:100%; height:100%;
  background:#010005;
  display:flex; align-items:center; justify-content:center;
  overflow:hidden;
}
canvas { position:fixed; inset:0; }
#ohm {
  position:fixed;
  font-size:96px;
  color:rgba(255,200,100,0.15);
  font-family:serif;
  user-select:none;
  transition:color 4s ease;
  z-index:10;
  text-align:center;
}
#freq {
  position:fixed; bottom:32px; left:0; right:0;
  text-align:center; font-family:monospace;
  font-size:11px; color:rgba(100,80,60,0.3);
  z-index:10;
}
#start {
  position:fixed; inset:0;
  display:flex; align-items:center; justify-content:center;
  background:#010005; z-index:20; cursor:pointer;
  font-family:serif; font-size:18px; color:rgba(255,200,100,0.4);
  letter-spacing:4px;
}
</style>
</head>
<body>

<canvas id="c"></canvas>
<div id="ohm">ॐ</div>
<div id="freq">25 Hz → α → θ → δ</div>
<div id="start" onclick="begin()">touch to begin</div>

<script>
const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');
const ohmEl  = document.getElementById('ohm');
const freqEl = document.getElementById('freq');

canvas.width  = window.innerWidth;
canvas.height = window.innerHeight;
window.addEventListener('resize', () => {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
});

let ac, drone, gain, lfo;
let phase = 0;
let startTime = null;
const SESSION = 20 * 60; // 20 min

// Brain frequency arc: 25Hz (beta) → 10Hz (alpha) → 6Hz (theta) → 2Hz (delta)
function currentBrainHz(elapsed) {
  const t = Math.min(elapsed / SESSION, 1);
  if(t < 0.25) return 25 - (25-10)*(t/0.25);       // 25→10
  if(t < 0.55) return 10 - (10-6)*((t-0.25)/0.30);  // 10→6
  if(t < 0.85) return 6  - (6-2)*((t-0.55)/0.30);   // 6→2
  return 2;
}

function begin() {
  document.getElementById('start').style.display = 'none';
  startTime = Date.now();

  // Web Audio
  ac   = new AudioContext();
  gain = ac.createGain();
  gain.gain.setValueAtTime(0, ac.currentTime);
  gain.gain.linearRampToValueAtTime(0.18, ac.currentTime + 6);
  gain.connect(ac.destination);

  // OM drone: 136.1 Hz (Earth year tone, cosmic octave — traditional AUM tuning)
  drone = ac.createOscillator();
  drone.type = 'sine';
  drone.frequency.value = 136.1;
  drone.connect(gain);
  drone.start();

  // Subtle octave below
  const drone2 = ac.createOscillator();
  const gain2  = ac.createGain();
  drone2.type = 'sine';
  drone2.frequency.value = 68.05;
  gain2.gain.value = 0.06;
  drone2.connect(gain2); gain2.connect(ac.destination);
  drone2.start();

  // Slow amplitude pulse (breath pace: 4s inhale 6s exhale)
  lfo = ac.createOscillator();
  lfo.frequency.value = 0.1; // one breath per 10s
  const lfoGain = ac.createGain();
  lfoGain.gain.value = 0.05;
  lfo.connect(lfoGain); lfoGain.connect(gain.gain);
  lfo.start();

  loop();
}

function loop() {
  requestAnimationFrame(loop);
  phase += 0.004;

  const elapsed = startTime ? (Date.now() - startTime) / 1000 : 0;
  const hz   = currentBrainHz(elapsed);
  const t    = Math.min(elapsed / SESSION, 1);

  // Breath: 0.1 Hz → very slow
  const breathPhase = (elapsed * 0.1) * Math.PI * 2;
  const breath = 0.5 + 0.5 * Math.sin(breathPhase);

  const W = canvas.width, H = canvas.height;
  const cx = W/2, cy = H/2;

  ctx.fillStyle = 'rgba(1,0,5,0.08)';
  ctx.fillRect(0,0,W,H);

  // Outer ring — brain frequency visualized as ripple speed
  const rings = 4;
  for(let i = 0; i < rings; i++) {
    const r = 60 + i*55 + breath*20;
    const alpha = (0.08 - i*0.015) * (1-t*0.3);
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI*2);
    ctx.strokeStyle = `rgba(180,120,40,${alpha})`;
    ctx.lineWidth = 1;
    ctx.stroke();
  }

  // Core breathing circle
  const coreR = 40 + breath * 28;
  const grad = ctx.createRadialGradient(cx,cy,0,cx,cy,coreR);
  grad.addColorStop(0,   `rgba(255,200,80,${0.12 + breath*0.08})`);
  grad.addColorStop(0.6, `rgba(180,100,40,${0.04 + breath*0.03})`);
  grad.addColorStop(1,   'rgba(0,0,0,0)');
  ctx.beginPath();
  ctx.arc(cx,cy,coreR,0,Math.PI*2);
  ctx.fillStyle = grad;
  ctx.fill();

  // OM symbol opacity follows breath
  ohmEl.style.color = `rgba(255,200,100,${0.08 + breath*0.18})`;

  // Frequency label
  const stateLabel = hz > 13 ? 'β beta' : hz > 8 ? 'α alpha' : hz > 4 ? 'θ theta' : 'δ delta';
  freqEl.textContent = `${hz.toFixed(1)} Hz  ·  ${stateLabel}  ·  136.1 Hz OM  ·  ॐ`;
  freqEl.style.color = `rgba(${hz>13?'180,100,60':hz>8?'100,160,180':hz>4?'80,140,140':'60,100,160'},0.25)`;
}

// silent draw before start
(function preloop() {
  requestAnimationFrame(preloop);
  const W=canvas.width,H=canvas.height,cx=W/2,cy=H/2;
  ctx.fillStyle='rgba(1,0,5,0.15)'; ctx.fillRect(0,0,W,H);
  const r = 50 + 20*Math.sin(phase*0.3);
  ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2);
  ctx.strokeStyle='rgba(180,120,40,0.05)'; ctx.lineWidth=1; ctx.stroke();
  phase+=0.005;
  if(startTime) return;
})();
</script>
</body>
</html>
