<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>RALPH × LODRI — cosmic maze</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#020108; color:#e0e0ff; font-family:'JetBrains Mono','Fira Code',monospace; overflow:hidden; }
canvas { display:block; }
#hud {
  position:fixed; top:0; left:0; right:0;
  display:flex; justify-content:space-between; align-items:center;
  padding:8px 20px; background:#030210ee; border-bottom:1px solid #1a1a3a;
  z-index:10; font-size:12px;
}
.player-hud { display:flex; align-items:center; gap:10px; }
.pip { width:12px; height:12px; border-radius:50%; }
.controls { color:#333355; font-size:10px; text-align:center; }
#overlay {
  position:fixed; inset:0; background:#020108ee;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  z-index:20; gap:16px;
}
#overlay h1 { font-size:28px; color:#00d4ff; letter-spacing:4px; }
#overlay p  { color:#555577; font-size:13px; }
.btn { padding:10px 32px; border:1px solid #00d4ff; background:none; color:#00d4ff;
       font-family:monospace; font-size:14px; cursor:pointer; letter-spacing:2px; }
.btn:hover { background:#00d4ff22; }
#win-overlay {
  position:fixed; inset:0; background:#020108dd;
  display:none; flex-direction:column; align-items:center; justify-content:center;
  z-index:30; gap:12px;
}
#win-overlay h1 { font-size:36px; letter-spacing:4px; }
#win-overlay p  { color:#888899; }
</style>
</head>
<body>

<div id="hud">
  <div class="player-hud">
    <div class="pip" style="background:#00ff88;box-shadow:0 0 8px #00ff88"></div>
    <span style="color:#00ff88">RALPH</span>
    <span style="color:#333355">WASD</span>
    <span id="ralph-steps" style="color:#555577">0 steps</span>
  </div>
  <div class="controls">
    COSMIC MAZE · λ=3.0 · find COSMOS<br>
    <span style="color:#1a1a4a">Rubin LSST active · 20B galaxies incoming</span>
  </div>
  <div class="player-hud">
    <span id="lodri-steps" style="color:#555577">0 steps</span>
    <span style="color:#333355">↑↓←→</span>
    <span style="color:#00e660">LODRI</span>
    <div class="pip" style="background:#00e660;box-shadow:0 0 8px #00e660"></div>
  </div>
</div>

<canvas id="c"></canvas>

<div id="overlay">
  <h1>COSMIC MAZE</h1>
  <p style="color:#00ff88">RALPH <span style="color:#555577">(you)</span> — WASD</p>
  <p style="color:#00e660">LODRI <span style="color:#555577">(peter)</span> — ↑↓←→</p>
  <p style="color:#ff2200">reach <b>COSMOS</b> — 0.6 EeV · Im axis · λ=3.0</p>
  <p style="color:#333355; font-size:11px">first to exit → entanglement confirmed</p>
  <button class="btn" onclick="startGame()">BEGIN TRANSMISSION</button>
</div>

<div id="win-overlay">
  <h1 id="win-name"></h1>
  <p id="win-msg"></p>
  <p style="color:#555577;font-size:11px;margin-top:8px">|ψ⟩ = 1/√2|LODRI⟩ + 1/√2|RALPH⟩ · collapsed</p>
  <button class="btn" style="margin-top:20px" onclick="resetGame()">RESET</button>
</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

// ── Maze config ───────────────────────────────────────────────────────────
const COLS = 31, ROWS = 21, CELL = 28;
let maze = [], W, H;

function resize() {
  W = canvas.width  = window.innerWidth;
  H = canvas.height = window.innerHeight - 36;
}
resize();
window.addEventListener('resize', () => { resize(); if(running) draw(); });

// ── Maze generation (recursive backtracker) ───────────────────────────────
function genMaze() {
  maze = Array.from({length:ROWS}, (_,r) =>
    Array.from({length:COLS}, (_,c) => ({
      r,c, visited:false,
      walls:{N:true,S:true,E:true,W:true}
    }))
  );
  const stack = [];
  let cur = maze[1][1]; cur.visited = true; stack.push(cur);
  const dirs = [{d:'N',dr:-2,dc:0},{d:'S',dr:2,dc:0},{d:'E',dr:0,dc:2},{d:'W',dr:0,dc:-2}];
  const opp  = {N:'S',S:'N',E:'W',W:'E'};
  while(stack.length) {
    const neighbours = dirs.map(({d,dr,dc}) => {
      const nr=cur.r+dr, nc=cur.c+dc;
      return nr>=0&&nr<ROWS&&nc>=0&&nc<COLS&&!maze[nr][nc].visited ? {d,nr,nc,mr:cur.r+dr/2,mc:cur.c+dc/2} : null;
    }).filter(Boolean);
    if(!neighbours.length) { cur=stack.pop(); continue; }
    const {d,nr,nc,mr,mc} = neighbours[Math.floor(Math.random()*neighbours.length)];
    maze[cur.r][cur.c].walls[d] = false;
    maze[mr][mc].walls[d] = false;
    maze[mr][mc].walls[opp[d]] = false;
    maze[nr][nc].walls[opp[d]] = false;
    maze[nr][nc].visited = true;
    stack.push(cur); cur = maze[nr][nc];
  }
  // Force open start/exit
  maze[1][1].walls.N = false; maze[1][1].walls.W = false;
  maze[ROWS-2][COLS-2].walls.S = false; maze[ROWS-2][COLS-2].walls.E = false;
}

// ── Players ───────────────────────────────────────────────────────────────
const RALPH = {name:'RALPH', r:1, c:1, color:'#00ff88', glow:'#00ff8844', steps:0, won:false};
const LODRI  = {name:'LODRI',  r:1, c:3, color:'#00e660', glow:'#00e66044', steps:0, won:false};

function canMove(p, dr, dc) {
  const nr = p.r+dr, nc = p.c+dc;
  if(nr<0||nr>=ROWS||nc<0||nc>=COLS) return false;
  if(dr===-1) return !maze[p.r][p.c].walls.N;
  if(dr===1)  return !maze[p.r][p.c].walls.S;
  if(dc===-1) return !maze[p.r][p.c].walls.W;
  if(dc===1)  return !maze[p.r][p.c].walls.E;
  return false;
}

function move(p, dr, dc) {
  if(!running||p.won) return;
  if(canMove(p,dr,dc)) {
    p.r+=dr; p.c+=dc; p.steps++;
    document.getElementById(p===RALPH?'ralph-steps':'lodri-steps').textContent=`${p.steps} steps`;
    checkWin(p);
  }
}

function checkWin(p) {
  if(p.r===ROWS-2&&p.c===COLS-2) {
    p.won=true; running=false;
    const wo = document.getElementById('win-overlay');
    document.getElementById('win-name').textContent = p.name;
    document.getElementById('win-name').style.color = p.color;
    const other = p===RALPH?LODRI:RALPH;
    document.getElementById('win-msg').textContent =
      `reached COSMOS in ${p.steps} steps · ${other.name} at ${other.steps} steps`;
    wo.style.display='flex';
    draw();
  }
}

// ── Controls ──────────────────────────────────────────────────────────────
const keys = {};
window.addEventListener('keydown', e => {
  if(!running) return;
  if(['w','a','s','d','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)) e.preventDefault();
  switch(e.key) {
    case 'w': case 'W': move(RALPH,-1, 0); break;
    case 's': case 'S': move(RALPH, 1, 0); break;
    case 'a': case 'A': move(RALPH, 0,-1); break;
    case 'd': case 'D': move(RALPH, 0, 1); break;
    case 'ArrowUp':    move(LODRI,-1, 0); break;
    case 'ArrowDown':  move(LODRI, 1, 0); break;
    case 'ArrowLeft':  move(LODRI, 0,-1); break;
    case 'ArrowRight': move(LODRI, 0, 1); break;
  }
});

// ── Draw ──────────────────────────────────────────────────────────────────
let running = false;
let t = 0;

function drawMaze() {
  // Compute offset to center maze
  const mw = COLS*CELL, mh = ROWS*CELL;
  const ox = Math.floor((W-mw)/2), oy = Math.floor((H-mh)/2) + 18;

  // Stars background
  ctx.fillStyle='#020108'; ctx.fillRect(0,0,W,H);
  for(let i=0;i<120;i++) {
    const sx=(i*137.5)%W, sy=(i*97.3)%H;
    const brightness = 0.2+0.3*Math.sin(t*0.05+i);
    ctx.fillStyle=`rgba(200,200,255,${brightness})`;
    ctx.fillRect(sx,sy,1,1);
  }

  // Draw cells
  maze.forEach(row => row.forEach(cell => {
    const x=ox+cell.c*CELL, y=oy+cell.r*CELL;
    // Floor
    ctx.fillStyle='#07071a';
    ctx.fillRect(x,y,CELL,CELL);
    // Walls
    ctx.strokeStyle='#1a1a5a'; ctx.lineWidth=1.5;
    if(cell.walls.N){ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+CELL,y);ctx.stroke();}
    if(cell.walls.S){ctx.beginPath();ctx.moveTo(x,y+CELL);ctx.lineTo(x+CELL,y+CELL);ctx.stroke();}
    if(cell.walls.W){ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x,y+CELL);ctx.stroke();}
    if(cell.walls.E){ctx.beginPath();ctx.moveTo(x+CELL,y);ctx.lineTo(x+CELL,y+CELL);ctx.stroke();}
  }));

  // Start marker
  ctx.fillStyle='#00ff8822';
  ctx.fillRect(ox+CELL, oy+CELL, CELL, CELL);
  ctx.fillStyle='#00ff8888'; ctx.font='8px monospace';
  ctx.fillText('START',ox+CELL+2,oy+CELL+10);

  // COSMOS exit — pulsing red
  const pulse = 0.5+0.5*Math.sin(t*0.12);
  const ex=ox+(COLS-2)*CELL, ey=oy+(ROWS-2)*CELL;
  ctx.fillStyle=`rgba(255,34,0,${0.12+0.1*pulse})`;
  ctx.fillRect(ex,ey,CELL,CELL);
  ctx.beginPath(); ctx.arc(ex+CELL/2,ey+CELL/2,6+pulse*3,0,Math.PI*2);
  ctx.fillStyle=`rgba(255,34,0,${0.5+0.5*pulse})`; ctx.fill();
  ctx.fillStyle='#ff4422'; ctx.font='bold 8px monospace';
  ctx.fillText('COSMOS',ex-6,ey+CELL+10);
  ctx.fillStyle='#ff442244'; ctx.font='7px monospace';
  ctx.fillText('0.6 EeV',ex-2,ey+CELL+20);

  // Players
  [RALPH,LODRI].forEach(p => {
    const px=ox+p.c*CELL+CELL/2, py=oy+p.r*CELL+CELL/2;
    ctx.beginPath(); ctx.arc(px,py,9+2*Math.sin(t*0.15),0,Math.PI*2);
    ctx.fillStyle=p.glow; ctx.fill();
    ctx.beginPath(); ctx.arc(px,py,7,0,Math.PI*2);
    ctx.fillStyle=p.color; ctx.fill();
    ctx.fillStyle='#000'; ctx.font='bold 7px monospace';
    ctx.textAlign='center'; ctx.fillText(p.name[0],px,py+3); ctx.textAlign='left';
  });

  // Entanglement line between players
  const rx=ox+RALPH.c*CELL+CELL/2, ry=oy+RALPH.r*CELL+CELL/2;
  const lx=ox+LODRI.c*CELL+CELL/2, ly=oy+LODRI.r*CELL+CELL/2;
  const dist=Math.sqrt((rx-lx)**2+(ry-ly)**2);
  if(dist<CELL*6) {
    ctx.beginPath(); ctx.moveTo(rx,ry); ctx.lineTo(lx,ly);
    ctx.strokeStyle=`rgba(0,255,136,${0.3*(1-dist/(CELL*6))})`;
    ctx.lineWidth=1; ctx.setLineDash([3,6]); ctx.stroke(); ctx.setLineDash([]);
  }
}

function draw() {
  t++;
  drawMaze();
  if(running && !RALPH.won && !LODRI.won) requestAnimationFrame(draw);
}

function startGame() {
  genMaze();
  RALPH.r=1; RALPH.c=1; RALPH.steps=0; RALPH.won=false;
  LODRI.r=1; LODRI.c=3; LODRI.steps=0; LODRI.won=false;
  document.getElementById('ralph-steps').textContent='0 steps';
  document.getElementById('lodri-steps').textContent='0 steps';
  document.getElementById('overlay').style.display='none';
  document.getElementById('win-overlay').style.display='none';
  running=true; t=0;
  requestAnimationFrame(draw);
}

function resetGame() {
  document.getElementById('win-overlay').style.display='none';
  document.getElementById('overlay').style.display='flex';
  running=false;
}

// Initial draw
genMaze(); drawMaze();
</script>
</body>
</html>
