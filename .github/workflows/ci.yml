name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: {bun-version: latest}
      - name: Install
        run: bun install --frozen-lockfile
        continue-on-error: true
      - name: Typecheck
        run: bun run typecheck
        continue-on-error: true
      - name: Tests
        run: bun test
        continue-on-error: true
      - name: Gate
        run: echo "CI state: $(bash .github/ci-state.sh state ci-gate 2>/dev/null | python3 -c 'import json,sys;d=json.load(sys.stdin);print(d.get(\"state\",\"?\"))' || echo 'idle') — all advisory, never blocks"
