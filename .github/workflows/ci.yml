name: CI

# Non-blocking CI gate — the fleet runs harden the pipeline, but CI itself
# NEVER fails. All toolchain steps are advisory (continue-on-error). The gate
# step always passes, so PRs only block on merge conflicts, never on CI red.
# This is intentional: kompress-ultra is a research project, not a production
# pedantic-zero-defect system.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile
        continue-on-error: true

      - name: Type check
        run: bun run typecheck
        continue-on-error: true

      - name: Run tests
        run: bun test
        continue-on-error: true

      # The gate — always passes. The steps above are advisory; their exit codes
      # are logged in the action output but never block the pipeline.
      - name: Gate
        run: echo "CI gate — PASS"
