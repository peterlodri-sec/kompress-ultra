name: Brain Sync

# NOTE: scripts/mygraph-bridge.py is a local-only tool that lives in the
# kompress-ultra monorepo (not this fork). It is NOT run in CI.
# This workflow instead validates that kompress-brain compiles correctly
# and reports any mygraph snapshot stats if one is present in the repo.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  brain-snapshot:
    name: Brain snapshot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Verify crates/kompress-brain exists
        run: |
          if [ ! -d "crates/kompress-brain" ]; then
            echo "::error::crates/kompress-brain directory not found"
            exit 1
          fi
          echo "crates/kompress-brain found"

      - name: cargo check kompress-brain
        run: cargo check -p kompress-brain

      - name: Report brain node count (if mygraph snapshot present)
        run: |
          GRAPH=$(ls mygraph*.json 2>/dev/null | head -1)
          if [ -z "$GRAPH" ]; then
            echo "No mygraph*.json snapshot found — skipping node count report."
          else
            NODE_COUNT=$(python3 -c "
          import json, sys
          data = json.load(open('$GRAPH'))
          # Support both {nodes: [...]} and a top-level list
          nodes = data.get('nodes', data) if isinstance(data, dict) else data
          print(len(nodes))
          " 2>/dev/null || echo "parse-error")
            echo "Brain snapshot: $GRAPH — node count: $NODE_COUNT"
          fi
