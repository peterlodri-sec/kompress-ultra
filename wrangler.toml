name = "kompress-ultra-api"
main = "server/worker.ts"
compatibility_date = "2026-06-29"
compatibility_flags = ["nodejs_compat"]

[[kv_namespaces]]
binding = "KOMPRESS_STATS"
id = "8dbcbdc2d5574e399abfebd7f31b7bb5"

[[durable_objects.bindings]]
name = "STATS_DO"
class_name = "StatsDO"

[[migrations]]
tag = "v1"
new_classes = ["StatsDO"]

routes = [{ pattern = "api.kompress.vaked.dev/*", zone_name = "vaked.dev" }]

[vars]
VERSION = "14.0.0"
REGION = "us"

# ── US region ──────────────────────────────────────────────────────────
[env.us]
vars = { REGION = "us", VERSION = "14.0.0" }
routes = [{ pattern = "api.kompress.vaked.dev/*", zone_name = "vaked.dev" }]

# ── EU region ──────────────────────────────────────────────────────────
[env.eu]
vars = { REGION = "eu", VERSION = "14.0.0" }
routes = [{ pattern = "eu.api.kompress.vaked.dev/*", zone_name = "vaked.dev" }]

# ── Asia region ────────────────────────────────────────────────────────
[env.asia]
vars = { REGION = "asia", VERSION = "14.0.0" }
routes = [{ pattern = "asia.api.kompress.vaked.dev/*", zone_name = "vaked.dev" }]
