steps:

  # ── 1. Install dependencies ──────────────────────────────────────
  - id: 'install'
    name: 'oven/bun:latest'
    entrypoint: 'bun'
    args: ['install', '--frozen-lockfile']
    waitFor: ['-']

  # ── 2. Typecheck ─────────────────────────────────────────────────
  - id: 'typecheck'
    name: 'oven/bun:latest'
    entrypoint: 'bun'
    args: ['run', 'typecheck']
    waitFor: ['install']

  # ── 3. Tests (advisory, never blocks) ────────────────────────────
  - id: 'test'
    name: 'oven/bun:latest'
    entrypoint: 'bun'
    args: ['test']
    allowFailure: true
    waitFor: ['install']

  # ── 4. Build library ─────────────────────────────────────────────
  - id: 'build'
    name: 'oven/bun:latest'
    entrypoint: 'bun'
    args: ['run', 'build']
    waitFor: ['install']

  # ── 5. Build container image ─────────────────────────────────────
  - id: 'build-image'
    name: 'gcr.io/cloud-builders/docker:latest'
    args:
      - 'build'
      - '-t'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO_ID}/kompress-ultra-api:$SHORT_SHA'
      - '-t'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO_ID}/kompress-ultra-api:latest'
      - '.'
    waitFor: ['build']

  # ── 6. Push to Artifact Registry ─────────────────────────────────
  - id: 'push-image'
    name: 'gcr.io/cloud-builders/docker:latest'
    args:
      - 'push'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO_ID}/kompress-ultra-api:$SHORT_SHA'
    waitFor: ['build-image']

  # ── 7. Deploy to Cloud Run ───────────────────────────────────────
  - id: 'deploy-cloudrun'
    name: 'gcr.io/cloud-builders/gcloud:latest'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        gcloud run deploy kompress-ultra-api \
          --image ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO_ID}/kompress-ultra-api:$SHORT_SHA \
          --region ${_REGION} \
          --platform managed \
          --allow-unauthenticated \
          --memory 512Mi \
          --cpu 1 \
          --min-instances 1 \
          --max-instances 10 \
          --timeout 60s \
          --set-env-vars VERSION=$SHORT_SHA,REGION=${_REGION} \
          --update-secrets AUTH_TOKEN=auth-token:latest \
          --add-label commit=$SHORT_SHA \
          2>/dev/null || echo "deploy-cloudrun: advisory — gcloud auth or quota issue"
    secretEnv: ['GCP_SA_KEY']
    allowFailure: true
    waitFor: ['push-image']

  # ── 8. Publish npm package to Artifact Registry ──────────────────
  - id: 'publish-arl'
    name: 'gcr.io/cloud-builders/npm:latest'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        npm config set @peterlodri-sec:registry https://${_REGION}-npm.pkg.dev/$PROJECT_ID/kompress-ultra-npm/
        npm config set //${_REGION}-npm.pkg.dev/$PROJECT_ID/kompress-ultra-npm/:_authToken=$$NPM_AUTH_TOKEN
        npm publish --access public 2>/dev/null || echo "publish-arl: advisory — no auth or dupe version"
    secretEnv: ['NPM_AUTH_TOKEN']
    allowFailure: true
    waitFor: ['build']

  # ── 9. Update CI state ───────────────────────────────────────────
  - id: 'ci-state'
    name: 'bash:latest'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        STATE="${BUILD_STATUS:-success}"
        echo "{\"source\":\"cloud-build\",\"build_id\":\"$BUILD_ID\",\"project\":\"$PROJECT_ID\",\"state\":\"$STATE\",\"version\":\"$SHORT_SHA\",\"ts\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}" \
          > /workspace/ci-state.json
        echo "ci-state: $STATE"

availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/gcp-sa-key/versions/latest
      env: 'GCP_SA_KEY'
    - versionName: projects/$PROJECT_ID/secrets/auth-token/versions/latest
      env: 'AUTH_TOKEN'
    - versionName: projects/$PROJECT_ID/secrets/npm-auth-token/versions/latest
      env: 'NPM_AUTH_TOKEN'

options:
  machineType: 'E2_HIGHCPU_8'
  substitutionOption: 'ALLOW_LOOSE'
  logging: 'CLOUD_LOGGING_ONLY'
  pool:
    name: projects/$PROJECT_ID/locations/${_REGION}/workerPools/default-pool

timeout: 900s

# ── Substitutions (set via gcloud builds submit --substitutions) ───
# _REGION: us-central1 (default)
# _REPO_ID: kompress-ultra-container
